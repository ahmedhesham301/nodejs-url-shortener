apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      containers:
        - name: backend
          image: ahmedhesham301/nodejs-url-shortener-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-cf
          env:
            - name: PGHOST 
              valueFrom:
                secretKeyRef:
                  name: postgresql-app
                  key: host
            - name: PGPASSWORD 
              valueFrom:
                secretKeyRef:
                  name: postgresql-app
                  key: password
            - name: PGUSER 
              valueFrom:
                secretKeyRef:
                  name: postgresql-app
                  key: user
            - name: PGDATABASE 
              valueFrom:
                secretKeyRef:
                  name: postgresql-app
                  key: dbname
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
