apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  labels:
    app.kubernetes.io/name: backend
spec:
  {{- if .Values.nodePort }}
  type: NodePort
  {{- end }}
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      {{- if .Values.nodePort }}
      nodePort: 32562
      {{- end }}