apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-hostnames-cf
data:
  lokiHost: {{ .Values.services.loki.host | quote }}
  lokiPort: {{ .Values.services.loki.port | quote }}

  prometheusHost: {{ .Values.services.prometheus.host | quote }}
  prometheusPort: {{ .Values.services.prometheus.port | quote }}

  tempoHost: {{ .Values.services.tempo.host | quote}}
  tempoPort: {{ .Values.services.tempo.port | quote}}

  # dbHost: {{ .Values.services.postgresql.host | quote }}
  # dbUser: {{ .Values.services.postgresql.user | quote }}
  # dbPassword: {{ .Values.services.postgresql.password | quote }}
  # dbDatabase: {{ .Values.services.postgresql.database | quote }}

  kafkaHost: {{ .Values.services.kafka.host | quote }}
  kafkaPort: {{ .Values.services.kafka.port | quote }}