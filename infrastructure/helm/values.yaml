scaling:
  minReplicas: 1
  maxReplicas: 12

db:
  host: "10.42.0.1"
  password: "1234"
  user: "postgres"
  database: "postgres"

redis:
  host: "url-redis-ha-haproxy.default.svc.cluster.local"
  port: "6379"
  password: "1234"

prometheus:
  host: "10.42.0.1"
  port: "9090"

loki:
  host: "10.42.0.1"
  port: "3100"

session:
  secret: "sus"

redis-ha:
  redisPassword: "1234"
  auth: true
  replicas: 1
  haproxy:
    enabled: true
    replicas: 1
    metrics:
      enabled: true
  redis:
    config:
      min-replicas-to-write: 0
  persistentVolume:
    enabled: false

env: "dev"
alloy:
  controller:
    podLabels:
      app: alloy
    volumes:
      extra:
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory

  alloy:
    stabilityLevel: "experimental"
    configMap:
      create: false
      name: alloy-config-cf
      key: config.alloy
    extraPorts:
      - name: "grpc"
        port: 4317
        targetPort: 4317
        protocol: "TCP"
      - name: "http"
        port: 4318
        targetPort: 4318
        protocol: "TCP"
    envFrom:
      - configMapRef:
          name: alloy-hostnames-cf
    mounts:
      varlog: true
      dockercontainers: true
      extra:
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
        - name: host-sys
          mountPath: /host/sys
          readOnly: true
    securityContext:
      privileged: true
      runAsUser: 0

nodePort: false

otel:
  hostname: url-alloy.default.svc.cluster.local
  port: 4317

tempo:
  host: 10.42.0.1
  port: 4317
