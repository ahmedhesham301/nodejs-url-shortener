services:
  frotned:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - 5173:5173

  server:
    image: ahmedhesham301/nodejs-url-shortener-backend
    ports:
      - 8080:8080
    environment:
      - PGHOST=db
      - PGPASSWORD=1234
      - PGUSER=postgres
      - PGDATABASE=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=1234
      - SESSION_SECRET=sus
      - NODE_ENV=dev
    depends_on:
      db:
        condition: service_healthy
      redis-stack:
        condition: service_healthy

  redis-stack:
    image: redis/redis-stack
    hostname: redis
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      REDIS_ARGS: "--requirepass 1234"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a 1234 ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    image: postgres:18
    environment:
      - POSTGRES_PASSWORD=1234
    ports:
      - 5432:5432
    restart: unless-stopped
    volumes:
      - ./backend/configs/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=ahmed.hesham.farag@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=1234
      - PGADMIN_LISTEN_ADDRESS=0.0.0.0
      # - SCRIPT_NAME=/pgadmin/
    ports:
      - 85:80
    restart: unless-stopped
